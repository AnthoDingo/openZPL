name: Pages

# Publie le contenu du dossier "pages" sur GitHub Pages a chaque push sur main
# qui modifie le site, et manuellement depuis l'onglet Actions.
on:
  push:
    branches:
      - main
    paths:
      - 'pages/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul deploiement a la fois, sans annuler celui deja en cours.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparer l'artefact du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages

      - name: Deployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
