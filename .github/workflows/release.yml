name: Release

# Se declenche uniquement sur un tag de version "X.Y.Z" (ex: 1.0.0).
# GitHub ne permet pas de combiner un filtre "tags" et un filtre "branches"
# en ET (les deux se combinent en OU), donc l'appartenance du tag a la
# branche main est verifiee explicitement dans la premiere etape du job.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verifier que le tag provient de la branche main
        shell: bash
        run: |
          git fetch origin main --quiet
          if ! git merge-base --is-ancestor "${{ github.sha }}" origin/main; then
            echo "Le tag ${{ github.ref_name }} ne provient pas de la branche main, annulation." >&2
            exit 1
          fi

      - name: Installer le SDK .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurer les dependances
        run: dotnet restore src/openZPL.csproj

      - name: Compiler et publier l'application
        run: >
          dotnet publish src/openZPL.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=${{ github.ref_name }}
          -o src/bin/Release/net10.0-windows/win-x64/publish

      - name: Installer Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Compiler l'installateur
        run: iscc "/DMyAppVersion=${{ github.ref_name }}" Setup\openZPL.iss

      - name: Preparer l'executable portable
        shell: bash
        run: |
          cp src/bin/Release/net10.0-windows/win-x64/publish/openZPL.exe \
             "openZPL-${{ github.ref_name }}-portable.exe"

      - name: Publier la release GitHub
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "Setup/Output/openZPL-Setup-${{ github.ref_name }}.exe" \
            "openZPL-${{ github.ref_name }}-portable.exe" \
            --title "openZPL ${{ github.ref_name }}" \
            --generate-notes
